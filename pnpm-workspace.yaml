packages:
  - "docs"
  - "packages/*"

# Shared dep versions used across packages.
catalog:
  "@astrojs/starlight": ^0.42.5
  "@theholocron/docs-theme": ^1.10.3
  "@tsconfig/node-lts": ^24.0.1
  "@types/node": ^26.6.4
  "@vitest/coverage-v8": ^4.1.10

  astro: ^7.3.5
  eslint: ^10.12.0
  eslint-plugin-n: ^18.4.1
  eslint-plugin-simple-import-sort: ^14.0.0
  globals: ^17.13.0
  happy-dom: ^20.14.5
  tsdown: ^0.23.0
  typescript: ^6.0.3
  vitest: ^4.1.10

# Holocron CLI and plugins — pinned in lockstep; bump together when running setup.
catalogs:
  # Shared configs — release in lockstep; bump all entries together.
  configs:
    "@theholocron/astro-config": ^8.7.0
    "@theholocron/commitlint-config": ^8.7.0
    "@theholocron/eslint-config": ^8.7.0
    "@theholocron/lint-staged-config": ^8.7.0
    "@theholocron/prettier-config": ^8.7.0
    "@theholocron/semantic-release-config": ^8.7.0
    "@theholocron/tsconfig": ^8.7.0
    "@theholocron/tsdown-config": ^8.7.0
    "@theholocron/vitest-config": ^8.7.0

  # Docs components and registry — release in lockstep; bump both entries together.
  docs:
    "@theholocron/components-doc": ^1.16.0
    "@theholocron/registry-doc": ^1.16.0

  # Holocron CLI and plugins — pinned in lockstep; bump together when running setup.
  holocron:
    "@theholocron/astromech": 5.0.0-alpha.3
    "@theholocron/cli": 5.0.0-alpha.3
    "@theholocron/holocron-plugin-cloudflare": 5.0.0-alpha.3
    "@theholocron/holocron-plugin-fern": 5.0.0-alpha.3
    "@theholocron/holocron-plugin-github": 5.0.0-alpha.3

overrides:
  "@eslint/json": ^1.2.0
