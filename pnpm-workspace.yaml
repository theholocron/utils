packages:
  - "docs"
  - "packages/*"

# Shared dep versions used across packages.
catalog:
  '@astrojs/starlight': ^0.41.10
  '@theholocron/docs-theme': ^1.5.0
  '@tsconfig/node-lts': ^24.0.1
  '@types/node': ^26.2.0
  '@vitest/coverage-v8': ^4.1.10

  astro: ^7.2.9
  eslint: ^10.9.0
  eslint-plugin-n: ^18.3.0
  eslint-plugin-simple-import-sort: ^14.0.0
  globals: ^17.11.0
  happy-dom: ^20.11.1
  tsdown: ^0.22.14
  typescript: ^6.0.3
  vitest: ^4.1.10

# Holocron CLI and plugins — pinned in lockstep; bump together when running setup.
catalogs:
  # Shared configs — release in lockstep; bump all entries together.
  configs:
    '@theholocron/astro-config': ^7.26.0
    '@theholocron/commitlint-config': ^7.26.0
    '@theholocron/eslint-config': ^7.26.0
    '@theholocron/lint-staged-config': ^7.26.0
    '@theholocron/prettier-config': ^7.26.0
    '@theholocron/semantic-release-config': ^7.26.0
    '@theholocron/tsconfig': ^7.26.0
    '@theholocron/tsdown-config': ^7.24.1
    '@theholocron/vitest-config': ^7.24.1

  # Docs components and registry — release in lockstep; bump both entries together.
  docs:
    '@theholocron/components-doc': ^1.6.1
    '@theholocron/registry-doc': ^1.6.1

  # Holocron CLI and plugins — range covers all alpha releases; switch to ^2.0.0 on stable.
  holocron:
    '@theholocron/cli': ^3.48.0
    '@theholocron/holocron-config': ^7.31.0
    '@theholocron/holocron-plugin-cloudflare': ^3.46.0
    '@theholocron/holocron-plugin-fern': ^3.46.0
    '@theholocron/holocron-plugin-github': ^3.48.0

overrides:
  '@eslint/json': ^1.2.0
