packages:
  - "docs"
  - "packages/*"

# Shared dep versions used across packages.
catalog:
  '@astrojs/starlight': ^0.41.7
  '@theholocron/docs-theme': ^1.3.5
  '@tsconfig/node-lts': ^24.0.1
  '@types/node': ^26.2.0
  '@vitest/coverage-v8': ^4.1.10

  astro: ^7.2.2
  eslint: ^10.8.1
  eslint-plugin-n: ^18.3.0
  eslint-plugin-simple-import-sort: ^14.0.0
  globals: ^17.11.0
  happy-dom: ^20.11.1
  tsdown: ^0.22.14
  typescript: ^6.0.3
  vitest: ^4.1.10

# Holocron CLI and plugins — pinned in lockstep; bump together when running setup.
catalogs:
  # Shared configs — release in lockstep; bump all entries together.
  configs:
    '@theholocron/astro-config': ^7.22.2
    '@theholocron/commitlint-config': ^7.19.1
    '@theholocron/eslint-config': ^7.19.1
    '@theholocron/lint-staged-config': ^7.19.1
    '@theholocron/prettier-config': ^7.19.1
    '@theholocron/semantic-release-config': ^7.19.1
    '@theholocron/tsconfig': ^7.19.1
    '@theholocron/tsdown-config': ^7.19.1
    '@theholocron/vitest-config': ^7.19.1

  # Holocron CLI and plugins — range covers all alpha releases; switch to ^2.0.0 on stable.
  holocron:
    '@theholocron/cli': ^3.24.4
    '@theholocron/holocron-config': ^7.19.1
    '@theholocron/holocron-plugin-github': ^3.24.4
