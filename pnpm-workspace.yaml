packages:
  - "docs"
  - "packages/*"

# Shared dep versions used across packages.
catalog:
  '@tsconfig/node-lts': ^24.0.0
  '@types/node': ^26.1.2
  '@vitest/coverage-v8': ^4.1.10
  happy-dom: ^20.11.1

  eslint: ^10.8.0
  eslint-plugin-n: ^18.2.2
  eslint-plugin-simple-import-sort: ^14.0.0
  globals: ^17.8.0
  tsdown: ^0.22.14
  typescript: ^6.0.3
  vitest: ^4.1.10

# Holocron CLI and plugins — pinned in lockstep; bump together when running setup.
catalogs:
# Shared configs — release in lockstep; bump all entries together.
  configs:
    '@theholocron/commitlint-config': ^7.6.1
    '@theholocron/semantic-release-config': ^7.6.1
    '@theholocron/eslint-config': ^7.6.1
    '@theholocron/lint-staged-config': ^7.6.1
    '@theholocron/prettier-config': ^7.6.1
    '@theholocron/tsdown-config': ^7.6.1
    '@theholocron/vitest-config': ^7.6.1

# Holocron CLI and plugins — range covers all alpha releases; switch to ^2.0.0 on stable.
  holocron:
    '@theholocron/cli': ^3.10.0
    '@theholocron/holocron-config': ^7.6.1
    '@theholocron/holocron-plugin-github': ^3.10.0
